name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'narayananexus/waaru'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a release from main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify SDK and package bytes
        run: npm run release:evidence
      - name: Select npm distribution tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "tag=$(GITHUB_REF_NAME="$RELEASE_TAG" node scripts/release-channel.mjs)" >> "$GITHUB_OUTPUT"
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.6.1 --ignore-scripts --no-audit --no-fund
      - name: Publish with npm provenance
        env:
          NPM_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish --access public --provenance --tag "$NPM_TAG"
